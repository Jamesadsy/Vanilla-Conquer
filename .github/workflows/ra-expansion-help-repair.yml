name: RA expansion help repair

permissions:
  contents: write

on:
  push:
    branches:
      - work/ra-expansion-help-repair
    paths:
      - '.github/workflows/ra-expansion-help-repair.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: work/ra-expansion-help-repair
          fetch-depth: 0

      - name: Apply narrow RA help-string repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          init_path = Path('redalert/init.cpp')
          init_text = init_path.read_text()
          init_old = r'''#ifdef STEVES_LOAD_OVERRIDE
              RawFileClass strings("CONQUER.ENG");
              if (strings.Is_Available()) {
                  SystemStrings = new char[strings.Size()];
                  strings.Read((void*)SystemStrings, strings.Size());
              } else {
                  SystemStrings = (char const*)MFCD::Retrieve(Language_Name("CONQUER"));
              }
          #else
              SystemStrings = (char const*)MFCD::Retrieve(Language_Name("CONQUER"));
          #endif'''
          init_new = r'''#ifdef STEVES_LOAD_OVERRIDE
              RawFileClass strings("CONQUER.ENG");
          #if defined(__APPLE__) && TARGET_OS_IOS
              /*
              ** The 1.08 loose-file override predates the expansion MIX layering. On iOS the
              ** accepted data layout can contain a loose base CONQUER.ENG next to EXPAND2.MIX;
              ** blindly preferring that loose file discards the expansion string IDs even though
              ** the correctly-prioritized expansion MIX is already registered and cached.
              ** Preserve the historical loose override unless the normal MIX lookup has selected
              ** an expansion CONQUER.ENG, in which case the expansion table is authoritative.
              */
              MFCD* strings_mix = nullptr;
              void* strings_pointer = nullptr;
              int strings_offset = 0;
              int strings_size = 0;
              bool strings_registered = MFCD::Offset(Language_Name("CONQUER"),
                                                     &strings_pointer,
                                                     &strings_mix,
                                                     &strings_offset,
                                                     &strings_size);

              auto mix_base_name = [](char const* filename) -> char const* {
                  if (filename == nullptr) {
                      return "<none>";
                  }
                  char const* slash = strrchr(filename, '/');
                  char const* backslash = strrchr(filename, '\\');
                  if (backslash != nullptr && (slash == nullptr || backslash > slash)) {
                      return backslash + 1;
                  }
                  return slash != nullptr ? slash + 1 : filename;
              };

              char const* strings_mix_name =
                  strings_mix != nullptr ? mix_base_name(strings_mix->Filename) : "<none>";
              bool expansion_strings = strings_registered && strings_pointer != nullptr
                  && strings_mix != nullptr
                  && (stricmp(strings_mix_name, "EXPAND2.MIX") == 0
                      || stricmp(strings_mix_name, "EXPAND.MIX") == 0);
              bool loose_strings_available = strings.Is_Available();

              if (expansion_strings) {
                  SystemStrings = (char const*)strings_pointer;
                  RA_IOS_Debug_Log("ra-strings: active=%s source=expansion-mix loose_available=%d offset=%d size=%d",
                                   strings_mix_name,
                                   loose_strings_available,
                                   strings_offset,
                                   strings_size);
              } else if (loose_strings_available) {
                  int loose_strings_size = strings.Size();
                  SystemStrings = new char[loose_strings_size];
                  strings.Read((void*)SystemStrings, loose_strings_size);
                  RA_IOS_Debug_Log("ra-strings: active=CONQUER.ENG source=loose mix_candidate=%s mix_registered=%d mix_resident=%d size=%d",
                                   strings_mix_name,
                                   strings_registered,
                                   strings_pointer != nullptr,
                                   loose_strings_size);
              } else {
                  SystemStrings = (char const*)MFCD::Retrieve(Language_Name("CONQUER"));
                  RA_IOS_Debug_Log("ra-strings: active=%s source=mix-fallback mix_registered=%d resident=%d size=%d",
                                   strings_mix_name,
                                   strings_registered,
                                   SystemStrings != nullptr,
                                   strings_size);
              }
          #else
              if (strings.Is_Available()) {
                  SystemStrings = new char[strings.Size()];
                  strings.Read((void*)SystemStrings, strings.Size());
              } else {
                  SystemStrings = (char const*)MFCD::Retrieve(Language_Name("CONQUER"));
              }
          #endif
          #else
              SystemStrings = (char const*)MFCD::Retrieve(Language_Name("CONQUER"));
          #endif'''
          if init_text.count(init_old) != 1:
              raise SystemExit(f'init.cpp bootstrap block match count={init_text.count(init_old)}')
          init_text = init_text.replace(init_old, init_new, 1)
          init_path.write_text(init_text)

          help_path = Path('redalert/help.cpp')
          help_text = help_path.read_text()

          draw_old = r'''    if (Text != TXT_NONE && (forced || !CountDownTimer)) {

                  if (LogicPage->Lock()) {
                      Plain_Text_Print(Text, DrawX, DrawY, Color, BLACK, TPF_MAP | TPF_NOSHADOW);'''
          draw_new = r'''    if (Text != TXT_NONE && (forced || !CountDownTimer)) {
              char const* resolved_text = Text_String(Text);
              if (resolved_text == nullptr) {
                  RA_IOS_Debug_Log("ra-help: unresolved scenario=%s text_id=%d stage=draw",
                                   Scen.ScenarioName,
                                   Text);
                  Text = TXT_NONE;
                  CountDownTimer = 0;
                  Cost = 0;
                  Width = 0;
                  OverlapList[0] = REFRESH_EOL;
                  return;
              }

                  if (LogicPage->Lock()) {
                      Plain_Text_Print(resolved_text, DrawX, DrawY, Color, BLACK, TPF_MAP | TPF_NOSHADOW);'''
          if help_text.count(draw_old) != 1:
              raise SystemExit(f'help.cpp Draw_It block match count={help_text.count(draw_old)}')
          help_text = help_text.replace(draw_old, draw_new, 1)

          set_old = r'''    if (text != TXT_NONE) {
                  Text = text;
                  Plain_Text_Print(TXT_NONE, 0, 0, 0, 0, TPF_MAP | TPF_NOSHADOW);
                  Width = String_Pixel_Width(Text_String(Text));'''
          set_new = r'''    if (text != TXT_NONE) {
              char const* resolved_text = Text_String(text);
              if (resolved_text == nullptr) {
                  RA_IOS_Debug_Log("ra-help: unresolved scenario=%s text_id=%d stage=set-text",
                                   Scen.ScenarioName,
                                   text);
                  Text = TXT_NONE;
                  CountDownTimer = 0;
                  Cost = 0;
                  Width = 0;
                  OverlapList[0] = REFRESH_EOL;
                  return;
              }

                  Text = text;
                  Plain_Text_Print(TXT_NONE, 0, 0, 0, 0, TPF_MAP | TPF_NOSHADOW);
                  Width = String_Pixel_Width(resolved_text);'''
          if help_text.count(set_old) != 1:
              raise SystemExit(f'help.cpp Set_Text pre-width block match count={help_text.count(set_old)}')
          help_text = help_text.replace(set_old, set_new, 1)

          overlap_old = r'''        memcpy((void*)OverlapList, Text_Overlap_List(Text_String(Text), DrawX - 1, DrawY), sizeof(OverlapList));'''
          overlap_new = r'''        memcpy((void*)OverlapList, Text_Overlap_List(resolved_text, DrawX - 1, DrawY), sizeof(OverlapList));'''
          if help_text.count(overlap_old) != 1:
              raise SystemExit(f'help.cpp overlap block match count={help_text.count(overlap_old)}')
          help_text = help_text.replace(overlap_old, overlap_new, 1)
          help_path.write_text(help_text)
          PY

          git diff --check
          git diff -- redalert/init.cpp redalert/help.cpp

      - name: Commit repaired source and remove temporary runner
        shell: bash
        run: |
          git config user.name "SecondSun RA repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ra-expansion-help-repair.yml
          git add redalert/init.cpp redalert/help.cpp
          git commit -m "Fix RA expansion help string selection on iOS"
          git push origin HEAD:work/ra-expansion-help-repair
