# Vanilla Conquer — iOS (arm64) stage-1 build [HARDENED]
# Place at: .github/workflows/ios.yml in this fork (vanilla branch)
#
# What this does:
#   1. Builds SDL2 and openal-soft as STATIC libs for iOS (no Frameworks/ dir, no rpath juggling)
#   2. Cross-compiles vanillatd + vanillara with CMake's native iOS support (Ninja = no Xcode project)
#   3. Optionally dumps common/paths.cpp for manually requested diagnostics
#   4. Patches Info.plist in-place (Track B): non-empty CFBundleIdentifier + iOS-required keys
#   5. Inspects + verifies the .app bundles and uploads them
#   6. Enables the engine's debugstring logging layer only when diagnostics are
#      explicitly requested on a manual dispatch
#   7. Stamps BUILDINFO.txt (commit / UTC time / run number) into each bundle so "which build is on
#      my phone?" is one glance in the Files app.
#
# Security hardening: least privilege, pinned dependencies/actions, diagnostics
# disabled by default, provenance/checksums, bounded artifact retention, and
# owner-neutral bundle identifiers.

name: iOS build (stage 1)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      enable_diagnostics:
        description: "Compile verbose engine logging and dump diagnostic source. Leave false for normal/public builds."
        type: boolean
        default: false
  push:
    branches:
      - vanilla
    paths:
      - 'common/**'
      - 'tiberiandawn/**'
      - 'redalert/**'
      - '.github/workflows/ios.yml'

env:
  IOS_DEPLOYMENT_TARGET: "16.0"          # safe floor; device is iOS 27
  PREFIX: ${{ github.workspace }}/ios-prefix
  BUNDLE_ID_PREFIX: "org.vanillaconquer"
  SDL_COMMIT: "76847b46be9cb461b7a289cc004fe3d3d10814f2"
  OPENAL_COMMIT: "4efe6146a1bf1f9c4782c1a9e1fc3d0dea18b972"

jobs:
  build-ios:
    runs-on: macos-latest                # Apple Silicon runner, Xcode + iOS SDK preinstalled
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Dump paths source (diagnostic - where does it look for data?)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_diagnostics }}
        run: |
          echo "=== common/paths.cpp ==="
          cat common/paths.cpp || echo "paths.cpp not found at common/paths.cpp"
          echo ""
          echo "=== common/paths.h ==="
          cat common/paths.h 2>/dev/null || echo "(no paths.h)"
          echo ""
          echo "=== grep for APPLE / BasePath / PrefPath / Application Support across common/ ==="
          grep -rn -i "APPLE\|BasePath\|PrefPath\|Application Support\|GetBasePath\|getcwd\|Data_Path\|Get_Path" common/ || true
      - name: Toolchain info (for the log)
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          cmake --version
      - name: Install ninja
        run: brew install ninja

      - name: Build SDL2 (static, iOS)
        run: |
          git clone https://github.com/libsdl-org/SDL.git sdl2-src
          git -C sdl2-src checkout "${SDL_COMMIT}"
          git -C sdl2-src rev-parse HEAD
          cmake -S sdl2-src -B sdl2-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_DEPLOYMENT_TARGET} \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX=${PREFIX}
          cmake --build sdl2-build --parallel
          cmake --install sdl2-build
          echo "=== confirm SDL2main static lib installed (needed for iOS main hijack) ==="
          ls -la ${PREFIX}/lib/ | grep -i sdl2main || { echo "::error::libSDL2main.a missing from prefix"; exit 1; }
      - name: Build openal-soft (static, iOS)
        run: |
          git clone https://github.com/kcat/openal-soft.git openal-src
          git -C openal-src checkout "${OPENAL_COMMIT}"
          git -C openal-src rev-parse HEAD
          cmake -S openal-src -B openal-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_DEPLOYMENT_TARGET} \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBTYPE=STATIC \
            -DALSOFT_REQUIRE_COREAUDIO=ON \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=${PREFIX}
          cmake --build openal-build --parallel
          cmake --install openal-build
      - name: Configure Vanilla Conquer (iOS)
        env:
          CMAKE_FIND_ROOT_PATH: ${{ env.PREFIX }}
          DIAG_FLAGS: ${{ (github.event_name == 'workflow_dispatch' && inputs.enable_diagnostics) && '-DVANILLA_LOG_ENABLE' || '' }}
        # NOTE: libSDL2main.a is prepended to the linker flags. On iOS, SDL owns
        # main(): startup.cpp includes SDL_main.h (renaming the engine's main to
        # SDL_main), and libSDL2main.a provides the real main() which starts the
        # UIKit application (UIApplicationMain) and then calls SDL_main from within
        # the app lifecycle. Without it the link either fails (no main) or the app
        # dies at SDL_CreateWindow with "Application didn't initialize properly".
        #
        # DIAG_FLAGS is empty for normal/public builds. Verbose engine logging is
        # compiled only when the manually-dispatched diagnostics input is enabled.
        run: |
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_DEPLOYMENT_TARGET} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${DIAG_FLAGS}" \
            -DCMAKE_OBJCXX_FLAGS="${DIAG_FLAGS}" \
            -DMAKE_BUNDLE=OFF \
            -DNETWORKING=ON \
            -DBUILD_VANILLATD=ON \
            -DBUILD_VANILLARA=ON \
            -DSDL2=ON \
            -DOPENAL=ON \
            -DSDL2_ROOT_DIR=${PREFIX} \
            -DOPENAL_ROOT=${PREFIX} \
            -DCMAKE_EXE_LINKER_FLAGS="${PREFIX}/lib/libSDL2main.a -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -framework Metal -framework AVFoundation -framework GameController -framework CoreMotion -framework CoreHaptics -framework CoreAudio -framework AudioToolbox -framework CoreVideo -framework CoreBluetooth -framework OpenGLES"
      - name: Build
        run: cmake --build build-ios --parallel

      - name: Stamp build info into bundles
        run: |
          NINJA_VERSION="$(ninja --version 2>/dev/null || echo unknown)"
          SDL_SHA="$(git -C sdl2-src rev-parse HEAD 2>/dev/null || echo unknown)"
          OPENAL_SHA="$(git -C openal-src rev-parse HEAD 2>/dev/null || echo unknown)"
          for app in vanillatd vanillara; do
            info="build-ios/$app.app/BUILDINFO.txt"
            {
              echo "warning=EXPERIMENTAL UNSIGNED DEBUG BUILD - NOT A SIGNED RELEASE - see SECURITY.md"
              echo "commit=${GITHUB_SHA}"
              echo "built_utc=$(date -u +%FT%TZ)"
              echo "run=${GITHUB_RUN_NUMBER}"
              echo "diagnostics_enabled=${{ (github.event_name == 'workflow_dispatch' && inputs.enable_diagnostics) && 'true' || 'false' }}"
              echo "dep_sdl_commit=${SDL_SHA}"
              echo "dep_openal_commit=${OPENAL_SHA}"
              echo "tool_ninja=${NINJA_VERSION}"
            } > "$info"
            echo "--- $app BUILDINFO.txt ---"; cat "$info"
          done
      - name: Fix Info.plist for iOS install (Track B)
        run: |
          PB=/usr/libexec/PlistBuddy
          for app in vanillatd vanillara; do
            plist="build-ios/$app.app/Info.plist"
            echo "=== patching $plist ==="
            $PB -c "Delete :CFBundleIdentifier" "$plist" 2>/dev/null || true
            $PB -c "Add :CFBundleIdentifier string ${BUNDLE_ID_PREFIX}.$app" "$plist"
            # Build 1: home-screen display name. TD -> "CnC TD", RA1 (vanillara) -> "CnC RA".
            # Only CFBundleDisplayName changes; CFBundleExecutable stays "$app"
            # (renaming the binary breaks launch/packaging).
            if [ "$app" = "vanillatd" ]; then
              $PB -c "Delete :CFBundleDisplayName" "$plist" 2>/dev/null || true
              $PB -c "Add :CFBundleDisplayName string CnC TD" "$plist"
              $PB -c "Delete :NSLocalNetworkUsageDescription" "$plist" 2>/dev/null || true
              $PB -c "Add :NSLocalNetworkUsageDescription string CnC TD uses your local network to find and join local multiplayer games." "$plist"
              $PB -c "Delete :NSBonjourServices" "$plist" 2>/dev/null || true
              $PB -c "Add :NSBonjourServices array" "$plist"
              $PB -c "Add :NSBonjourServices:0 string _vctd._tcp" "$plist"
            elif [ "$app" = "vanillara" ]; then
              $PB -c "Delete :CFBundleDisplayName" "$plist" 2>/dev/null || true
              $PB -c "Add :CFBundleDisplayName string CnC RA" "$plist"
              $PB -c "Delete :NSLocalNetworkUsageDescription" "$plist" 2>/dev/null || true
              $PB -c "Add :NSLocalNetworkUsageDescription string CnC RA uses your local network to find and join local multiplayer games." "$plist"
            fi
            $PB -c "Delete :LSRequiresIPhoneOS" "$plist" 2>/dev/null || true
            $PB -c "Add :LSRequiresIPhoneOS bool true" "$plist"
            $PB -c "Delete :MinimumOSVersion" "$plist" 2>/dev/null || true
            $PB -c "Add :MinimumOSVersion string 16.0" "$plist"
            $PB -c "Delete :UIDeviceFamily" "$plist" 2>/dev/null || true
            $PB -c "Add :UIDeviceFamily array" "$plist"
            $PB -c "Add :UIDeviceFamily:0 integer 1" "$plist"
            $PB -c "Add :UIDeviceFamily:1 integer 2" "$plist"
            $PB -c "Delete :CFBundleSupportedPlatforms" "$plist" 2>/dev/null || true
            $PB -c "Add :CFBundleSupportedPlatforms array" "$plist"
            $PB -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" "$plist"
            $PB -c "Delete :UILaunchScreen" "$plist" 2>/dev/null || true
            $PB -c "Add :UILaunchScreen dict" "$plist"
            $PB -c "Delete :UIFileSharingEnabled" "$plist" 2>/dev/null || true
            $PB -c "Add :UIFileSharingEnabled bool true" "$plist"
            $PB -c "Delete :LSSupportsOpeningDocumentsInPlace" "$plist" 2>/dev/null || true
            $PB -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$plist"
            $PB -c "Delete :UISupportedInterfaceOrientations" "$plist" 2>/dev/null || true
            $PB -c "Add :UISupportedInterfaceOrientations array" "$plist"
            $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$plist"
            $PB -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$plist"
            $PB -c "Delete :UISupportedInterfaceOrientations~ipad" "$plist" 2>/dev/null || true
            $PB -c "Add :UISupportedInterfaceOrientations~ipad array" "$plist"
            $PB -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$plist"
            $PB -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$plist"
            $PB -c "Delete :UIRequiresFullScreen" "$plist" 2>/dev/null || true
            $PB -c "Add :UIRequiresFullScreen bool true" "$plist"
            echo "--- result ---"
            cat "$plist"
          done
      - name: Embed app icon
        run: |
          PB=/usr/libexec/PlistBuddy
          for app in vanillatd vanillara; do
            # WO-008 completion: per-app icon source. TD keeps icon-1024.png;
            # RA1 (vanillara) uses its own committed asset icon-ra-1024.png.
            if [ "$app" = "vanillara" ]; then
              SRC="iOS/icon-ra-1024.png"
            else
              SRC="iOS/icon-1024.png"
            fi
            if [ ! -f "$SRC" ]; then
              echo "::error::icon source $SRC not found"; exit 1
            fi
            bundle="build-ios/$app.app"
            plist="$bundle/Info.plist"
            sips -z 120 120 "$SRC" --out "$bundle/AppIcon60x60@2x.png"
            sips -z 180 180 "$SRC" --out "$bundle/AppIcon60x60@3x.png"
            sips -z 76  76  "$SRC" --out "$bundle/AppIcon76x76~ipad.png"
            sips -z 152 152 "$SRC" --out "$bundle/AppIcon76x76@2x~ipad.png"
            sips -z 167 167 "$SRC" --out "$bundle/AppIcon83.5x83.5@2x~ipad.png"
            $PB -c "Delete :CFBundleIconName" "$plist" 2>/dev/null || true
            $PB -c "Add :CFBundleIconName string AppIcon" "$plist"
            $PB -c "Delete :CFBundleIcons" "$plist" 2>/dev/null || true
            $PB -c "Add :CFBundleIcons dict" "$plist"
            $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$plist"
            $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$plist"
            $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$plist"
            $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$plist"
            $PB -c "Delete :CFBundleIcons~ipad" "$plist" 2>/dev/null || true
            $PB -c "Add :CFBundleIcons~ipad dict" "$plist"
            $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon dict" "$plist"
            $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$plist"
            $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles array" "$plist"
            $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$plist"
            $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:1 string AppIcon76x76" "$plist"
            $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:2 string AppIcon83.5x83.5" "$plist"
          done
      - name: Inspect, verify & package bundle
        run: |
          echo "=== bundle contents (td) ==="
          ls -la build-ios/vanillatd.app
          echo "=== bundle contents (ra) ==="
          ls -la build-ios/vanillara.app
          for app in vanillatd vanillara; do
            bin="build-ios/$app.app/$app"
            if [ ! -f "$bin" ]; then
              echo "::error::executable missing inside $app.app - check ls output above"
              exit 1
            fi
            file "$bin"
            file "$bin" | grep -q "arm64" || { echo "::error::$app is not arm64"; exit 1; }
            echo "--- linkage for $app ---"
            otool -L "$bin"
          done
      - name: Generate artifact checksums
        run: |
          cd build-ios
          find vanillatd.app vanillara.app -type f -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
      - name: Upload app bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vanilla-conquer-ios-arm64-experimental-unsigned-debug
          retention-days: 7
          path: |
            build-ios/vanillatd.app
            build-ios/vanillara.app
            build-ios/SHA256SUMS.txt
          if-no-files-found: error
